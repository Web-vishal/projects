services:
  db:
    image: mysql:8.0
    container_name: user-mgmt-db
    restart: always
    environment:
      MYSQL_DATABASE: software
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    networks:
      - user-mgmt-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: user-mgmt-backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=software
      - DB_USER=root
      - DB_PASS=rootpassword
    depends_on:
      - db
    networks:
      - user-mgmt-network

networks:
  user-mgmt-network:
    driver: bridge

volumes:
  db_data:
